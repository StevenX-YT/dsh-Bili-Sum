# dsh-Bili-Sum bundle patch — zero absolute paths.
# All paths resolve at mount time via !!js against the live profile context:
#   server.js / cwd -> the installed package dir under this profile's node_modules
#   BILI_DATA_ROOT  -> <dsh home>/bili-sum  (runtime data: output / tools / bin / cookie)
# node: resolved from PATH; set env BILI_NODE_PATH to an absolute node path when PATH lacks it.
- insert:
    - id: dsh-bili-sum
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bilibili
        transport: stdio
        command: !!js "process.env.BILI_NODE_PATH || 'node'"
        args: !!js "[ctx.get('profileContext').dir + '/node_modules/dsh-bili-sum/server.js']"
        cwd: !!js "ctx.get('profileContext').dir + '/node_modules/dsh-bili-sum'"
        env:
          BILI_DATA_ROOT: !!js "ctx.get('dshHomePath')('bili-sum')"
        failOnStartupError: true
