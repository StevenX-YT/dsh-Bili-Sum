<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 摘要：{{TITLE}}</title>
<!--
  templates/note-skeleton-share.html — 分享/杂谈模板（token 版，OUTPUT-STANDARDS §4.4，轻量格式）
  渲染器：node scripts/render-notes.mjs <目录> --template share
  content.json schema（share）：
  {
    "out": "share-notes.html", "attr": "分享速览（vlog·旅行）",
    "tldr": "一句话 TL;DR",
    "timeline": [{"ts":"00:00","text":"事件/梗一句描述"}],
    "quotes": [{"ts":"02:15","text":"语录原话（逐字）"}],
    "useful": [{"label":"同款/地点/歌名","value":"…","ts":"可选"}],
    "dm": [{"cat":"刷屏|反驳|指引|神评","ts":"…","text":"…"}],
    "gridNote": "可选"
  }
  轻量纪律：Q&A/术语/归因表不适用，整块省略；区块内容不足则整块省略不硬凑。
-->
<style>
  :root { --blue:#0054a6; --ink:#1f2329; --muted:#667085; --line:#e3e5e8; --bg:#f7f8fa; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; color:var(--ink); background:var(--bg); margin:0; line-height:1.75; }
  main { max-width:880px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:21px; line-height:1.5; margin:6px 0 14px; }
  h2 { font-size:17px; margin:34px 0 10px; padding-left:9px; border-left:4px solid var(--blue); }
  .meta { background:#fff; border:1px solid var(--line); border-radius:10px; padding:12px 16px; font-size:13px; color:var(--muted); display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:4px 18px; }
  .meta b { color:var(--ink); font-weight:600; }
  .meta a { color:var(--blue); text-decoration:none; }
  .attr { display:inline-block; background:#eaf3fd; color:var(--blue); border-radius:6px; padding:0 8px; font-size:12px; margin-left:6px; vertical-align:1px; }
  .ts { display:inline-block; white-space:nowrap; background:var(--blue); color:#fff; border-radius:4px; padding:0 6px; font-size:12px; margin-right:6px; }
  a.ts-jump { color:#fff; text-decoration:none; }
  .tldr { background:#fff; border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:10px; padding:12px 16px; font-size:15px; font-weight:600; margin:10px 0; }
  table { border-collapse:collapse; width:100%; background:#fff; font-size:13.5px; }
  th,td { border:1px solid var(--line); padding:6px 10px; text-align:left; vertical-align:top; }
  th { background:#f0f4f9; font-weight:600; white-space:nowrap; }
  .quote { border-left:3px solid var(--blue); background:#eaf3fd; border-radius:0 8px 8px 0; padding:8px 12px; margin:8px 0; font-size:14px; }
  .useful { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin:8px 0; font-size:14px; }
  .dm { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin:8px 0; font-size:13.5px; }
  .dm .cat { color:#fff; background:#7c8798; border-radius:5px; font-size:11.5px; padding:0 7px; margin-right:8px; }
  .dm .cat.refute { background:#c2571f; }
  .dm .cat.god { background:#0054a6; }
  .dm .cat.guide { background:#2e8b57; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; margin:10px 0; }
  .grid figure { margin:0; background:#fff; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .grid img { width:100%; display:block; cursor:zoom-in; }
  .grid figcaption { font-size:12px; color:var(--muted); padding:5px 8px; }
  .note { font-size:12.5px; color:var(--muted); margin-top:2px; }
  details.full { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 16px; margin-top:10px; }
  details.full summary { cursor:pointer; color:var(--blue); font-size:13.5px; }
  pre#transcript { white-space:pre-wrap; font-size:12.5px; line-height:1.9; color:#444; font-family:inherit; margin:10px 0 0; }
  footer { margin-top:36px; font-size:12px; color:var(--muted); border-top:1px solid var(--line); padding-top:12px; }
</style>
</head>
<body>
<main>
  <div class="note">AI 摘要（分享/杂谈）</div>
  <h1>{{TITLE}}</h1>

  <div class="meta">{{META}}</div>

  <div class="tldr">{{TLDR}}</div>

{{TIMELINE_BLOCK}}
{{QUOTES_BLOCK}}
{{USEFUL_BLOCK}}

{{DM_BLOCK}}
{{GRID_BLOCK}}

  <h2>附录</h2>
  <details class="full">
    <summary>完整转录（原始语音转录，正文已静默校正，本附录仅供对照）</summary>
    <pre id="transcript">{{TRANSCRIPT}}</pre>
  </details>

  <footer>
    生成：AI 摘要流水线（analyze · route=balanced · whisper small+VAD · {{DATE}}）｜
    数据来源：视频转录 + 画面帧 + 弹幕信号｜点击蓝色时间戳可在页内小窗播放，右键可在B站新标签页空降
  </footer>
</main>
</body>
</html>
